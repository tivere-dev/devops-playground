name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run unit tests
        run: cd app && pytest -v

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and ShellCheck
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh

  docker:
    needs: [test, lint-scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t devops-app:ci ./app
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 devops-app:ci
          for i in $(seq 1 15); do curl -sf localhost:5000/health && break; sleep 2; done
          curl -sf localhost:5000/health
          docker logs smoke
      - name: Security scan the image with Trivy (report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 0 devops-app:ci
