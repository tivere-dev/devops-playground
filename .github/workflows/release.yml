name: Release image

# Every push to main builds the image and pushes it to GitHub Container Registry (ghcr.io)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # allow this workflow to push images to ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built in - no secret to create

      - name: Build, scan and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"   # ,, = lowercase (registries need lowercase names)
          TAG="${GITHUB_SHA::7}"                    # first 7 characters of the commit ID
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" ./app
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG and $IMAGE:latest"
