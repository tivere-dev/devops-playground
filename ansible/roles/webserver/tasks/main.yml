- name: Install nginx (and curl for testing)
  ansible.builtin.apt:
    name: [nginx, curl]
    state: present
    update_cache: true

- name: Create the developers group
  ansible.builtin.group:
    name: developers
    state: present

- name: Create team users in the developers group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: developers
    append: true
    shell: /bin/bash
  loop: "{{ team_users }}"

- name: Listen on IPv4 only (lab containers have no IPv6)
  ansible.builtin.lineinfile:
    path: /etc/nginx/sites-available/default
    regexp: '^\s*listen \[::\]:80'
    state: absent
  notify: Reload nginx

- name: Deploy the home page from a template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Reload nginx

- name: Make sure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
