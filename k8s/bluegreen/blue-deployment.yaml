# Blue/Green on Kubernetes: the blue copy of the app (version v1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
spec:
  replicas: 2
  selector:
    matchLabels: { app: web, color: blue }
  template:
    metadata:
      labels: { app: web, color: blue }
    spec:
      containers:
        - name: app
          image: devops-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - { name: COLOR, value: "blue" }
            - { name: VERSION, value: "v1" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 5
