# Canary on Kubernetes: 1 pod(s) of v2. The Service sends traffic to ALL pods with app=shop,
# so traffic splits by pod count (3 stable + 1 canary = about 25% to the canary).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-canary
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop, track: canary }
  template:
    metadata:
      labels: { app: shop, track: canary }
    spec:
      containers:
        - name: app
          image: devops-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - { name: COLOR, value: "orange" }
            - { name: VERSION, value: "v2" }
