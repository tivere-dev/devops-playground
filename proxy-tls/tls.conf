# HTTPS front door: terminates TLS, then forwards plain HTTP to our existing proxy
server {
    listen 80;
    # Anyone using http:// is sent to https:// (301 = moved permanently)
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/local.crt;   # the certificate (public, shown to browsers)
    ssl_certificate_key /etc/nginx/certs/local.key;   # the private key (secret!)
    ssl_protocols       TLSv1.2 TLSv1.3;              # modern, secure versions only

    # Tell browsers to always use HTTPS for this site from now on
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://proxy:80;                   # our Blue/Green proxy
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
