# Which app copies get traffic is decided in active.conf (scripts rewrite it).
include /etc/nginx/active.conf;

server {
    listen 80;

    # Send every request to whichever app copies are "active"
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The proxy's own health check
    location /proxy-health {
        access_log off;
        return 200 "proxy ok\n";
    }
}
